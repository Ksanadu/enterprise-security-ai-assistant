[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "esaa-backend"
version = "0.1.0"
description = "Enterprise Security AI Assistant - FastAPI backend (simulated data only)"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[tool.setuptools]
packages = ["app"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

# ---------------------------------------------------------------- ruff ------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "S", "RUF"]
ignore = [
    "E501",   # handled by the formatter
    "B008",   # FastAPI depends() in defaults is idiomatic
    "S101",   # asserts are the test framework
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S107"]   # test fixtures use obvious dummy secrets
"scripts/*" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

# --------------------------------------------------------------- mypy ------
[tool.mypy]
python_version = "3.12"
mypy_path = "."
packages = ["app"]
strict = false
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tests.*"]
check_untyped_defs = false

# ------------------------------------------------------------ coverage -----
[tool.coverage.run]
source = ["app"]
# `app/main.py` used to be omitted, which meant the one module that wires the whole
# application - the lifespan, the seeding, the service construction - was never
# measured even though every test executes it through `TestClient`. Excluding a
# module from measurement because it is "just wiring" is how wiring breaks silently.
omit = ["*/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
# A floor, not a target: measured 95% when this was set. It exists so that deleting
# tests without deleting code fails the gate instead of quietly reducing a number
# nobody looks at.
fail_under = 90
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
