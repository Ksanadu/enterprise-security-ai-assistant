[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra --strict-markers --strict-config
filterwarnings =
    error::DeprecationWarning:app.*
markers =
    security: security-focused tests (RBAC, injection, leakage)
    evaluation: the question evaluation set (slower; runs the whole pipeline)
    slow: slower end-to-end tests
