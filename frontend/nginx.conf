# ---------------------------------------------------------------------------
# nginx configuration for the Enterprise Security AI Assistant frontend.
#
# Responsibilities:
#   1. serve the Vite build output,
#   2. fall back to index.html so client-side routes survive a refresh,
#   3. proxy /api to the backend container, which keeps the browser same-origin
#      and therefore removes CORS from the production path entirely,
#   4. attach the security headers.
#
# Inheriting headers: nginx `add_header` is inherited by a nested block only
# while that block declares no `add_header` of its own. The /assets/ block below
# therefore uses `expires` (a separate directive) rather than an `add_header
# Cache-Control ...`, so it keeps all four security headers.
# ---------------------------------------------------------------------------

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Do not advertise the exact nginx version in responses or error pages.
    server_tokens off;

    # Request body limit. The chat endpoint accepts a bounded question string;
    # nothing in this application uploads files, so a small cap is sufficient
    # and reduces the blast radius of a malformed or hostile request.
    client_max_body_size 64k;

    # -----------------------------------------------------------------------
    # Security headers
    # -----------------------------------------------------------------------
    # Deny framing, MIME sniffing and referrer leakage.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # Mirrors the policy injected into index.html at build time
    # (see frontend/vite.config.ts). Sent as a header as well so it also covers
    # responses that are not the HTML document. `connect-src 'self'` is enough
    # because the API is proxied through this same origin.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

    # -----------------------------------------------------------------------
    # API reverse proxy
    # -----------------------------------------------------------------------
    # No trailing slash on proxy_pass: the full original URI (/api/v1/...) is
    # forwarded unchanged, which is the path the backend is mounted under.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # $proxy_add_x_forwarded_for appends the peer address to whatever the
        # client sent, so the *rightmost* entry is always the real one. The
        # backend reads from the right and only because the compose file sets
        # TRUSTED_PROXY_COUNT=1; with that left at 0 the header is ignored and a
        # forged value changes nothing.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        # Answer generation can legitimately take a while on a slow provider.
        proxy_read_timeout 120s;

        # Never cache API responses: they are per-user and authenticated.
        add_header Cache-Control "no-store" always;

        # Repeated for the reason described in the header-comment above: this
        # block declares its own add_header and so stops inheriting. `nosniff`
        # matters most here, since a JSON body must never be sniffed into HTML.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    }

    # -----------------------------------------------------------------------
    # Static assets
    # -----------------------------------------------------------------------
    # Vite emits content-hashed filenames, so these are safe to cache forever.
    location /assets/ {
        expires 1y;
        access_log off;
        try_files $uri =404;
    }

    # -----------------------------------------------------------------------
    # Single-page application entry point
    # -----------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The HTML document itself must never be cached, otherwise a client can keep
    # loading an old bundle that references purged asset hashes.
    location = /index.html {
        add_header Cache-Control "no-store" always;

        # Repeated for the reason described in the header-comment above: this
        # block declares its own add_header and so stops inheriting.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    }

    # Do not leak a body for these.
    location = /favicon.ico {
        access_log off;
        log_not_found off;
        try_files $uri =204;
    }
}
