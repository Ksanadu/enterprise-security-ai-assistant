# The gate that was missing.
#
# `scripts/check.ps1` existed but nothing ran it, so 1416 tests passed while a
# prompt guard refused the product's own headline question and a possible account
# takeover was answered with "I do not know". A suite that cannot see its own blind
# spots needs a pipeline that at least measures them on every change.
#
# The job runs on Windows because the scripts, the virtualenv layout and the paths
# are Windows-first (the project's own runbook is PowerShell). `check.ps1` is the
# single source of truth: this workflow installs the toolchain and calls it, so the
# pipeline and a developer's local gate can never drift apart.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    name: check.ps1 (ruff, mypy, pytest+cov, tsc, eslint, vitest+cov, secret scan)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      # Pinned to the current action majors: v4/v5 of these still target Node 20,
      # which GitHub now forces onto Node 24 and warns about on every run. A clean
      # annotation list is a diagnostic tool here - the only annotations this
      # workflow should ever produce are the failing gates it reports itself.
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Set up Node 20
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Create the backend virtualenv
        working-directory: backend
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -r requirements.txt
          .\.venv\Scripts\python.exe -m pip install -r requirements-dev.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # The documented first-time setup (README "First-time setup") ends with this
      # copy, so the pipeline gets the same configuration a developer gets. It also
      # matters for the deployment check: docker-compose.yml declares
      # `env_file: - .env`, and Compose treats a missing env file as an error, so
      # without this line the one environment that can validate the compose file is
      # the one environment that has nothing to validate it with.
      - name: Create .env from the template
        shell: pwsh
        run: Copy-Item .env.example .env

      - name: Run the gate
        shell: pwsh
        run: ./scripts/check.ps1
